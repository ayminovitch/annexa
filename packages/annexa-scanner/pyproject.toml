[project]
name = "annexa-scanner"
version = "0.1.0"
description = "Static analysis CLI for AI Act discovery"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12.3",
    "rich>=13.9.2"
]

[project.scripts]
annexa-scan = "annexa_scanner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"