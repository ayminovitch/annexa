[project]
name = "annexa-sdk"
version = "0.1.0"
description = "Telemetry and Evidence SDK for EU AI Act Compliance"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "opentelemetry-api>=1.27.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/annexa_sdk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"