[project]
name = "annexa"
version = "0.1.0"
description = "EU AI Act Compliance-as-Code Platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "mypy>=1.14.0",
    "ruff>=0.8.0",
    "import-linter>=2.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpath = ["tests"]
addopts = "-v"

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
warn_unreachable = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.importlinter]
root_package = "annexa"

[[tool.importlinter.contracts]]
name = "Domain is independent"
type = "layers"
layers = [
    "annexa.shared.domain",
]