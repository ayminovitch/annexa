[project]
name = "annexa"
version = "0.1.0"
description = "EU AI Act Compliance-as-Code Platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.4",
    "uvicorn>=0.32.0",
    "pydantic-settings>=2.6.1",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "greenlet>=3.1.1",
    "structlog>=24.4.0",
    "pyjwt>=2.9.0",
    "argon2-cffi>=23.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.14.0",
    "ruff>=0.8.0",
    "import-linter>=2.1.0",
    "httpx>=0.27.2",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
warn_unreachable = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.importlinter]
root_package = "annexa"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Security",
]

[[tool.importlinter.contracts]]
name = "Hexagonal Architecture with Shared Kernel"
type = "layers"
layers = [
    "annexa.entrypoints",
    "annexa.identity.infrastructure",
    "annexa.shared.infrastructure",
    "annexa.config",
    "annexa.identity.application",
    "annexa.shared.application",
    "annexa.identity.domain",
    "annexa.shared.domain",
]
